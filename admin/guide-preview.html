<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ガイド印刷用プレビュー｜ANDANTINO</title>
    <meta name="robots" content="noindex,nofollow,nosnippet,noarchive">
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="./admin.css">
    <style>
      /* このページはPDF化する原稿のプレビュー専用。管理画面の見た目は流用しつつ、
         印刷時は操作用のボタン類を消し、本文だけが紙面に出るようにする。 */
      body.admin-page { background: #fff; }
      .guide-toolbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 14px 24px;
        background: var(--cream-2);
        border-bottom: 1px solid var(--line);
      }
      .guide-paper {
        max-width: 760px;
        margin: 32px auto 80px;
        padding: 0 24px;
      }
      .guide-paper h1 {
        font-family: var(--serif);
        color: var(--teal);
        margin-bottom: 4px;
      }
      .guide-meta {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 32px;
      }
      .guide-toc {
        background: var(--cream-2);
        border-radius: 14px;
        padding: 18px 22px;
        margin-bottom: 40px;
      }
      .guide-toc h2 {
        font-size: 15px;
        margin: 0 0 10px;
        color: var(--teal);
      }
      .guide-toc ol {
        margin: 0;
        padding-left: 20px;
      }
      .guide-section {
        margin-bottom: 48px;
        padding-bottom: 32px;
        border-bottom: 1px solid var(--line);
      }
      .guide-section h2 {
        font-family: var(--serif);
        color: var(--teal);
      }
      .guide-cta {
        margin-top: 40px;
        padding: 24px 26px;
        background: var(--peach);
        border-radius: 16px;
      }
      .guide-cta h2 {
        margin-top: 0;
        color: var(--teal);
      }
      @media print {
        .guide-toolbar,
        .admin-header {
          display: none !important;
        }
        .guide-paper {
          margin: 0 auto;
          max-width: none;
        }
        .guide-section {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body class="admin-page">
    <header class="admin-header">
      <div class="admin-header__inner">
        <span class="brand__name">ANDANTINO</span>
        <span class="admin-header__title">ガイド印刷用プレビュー</span>
      </div>
    </header>

    <div class="guide-toolbar">
      <a class="outline-button outline-button--small" href="./">管理画面に戻る</a>
      <button type="button" class="button button--small" id="print-button">この内容を印刷／PDFとして保存</button>
      <span class="admin-note" id="guide-status"></span>
    </div>

    <main class="guide-paper" id="guide-paper" hidden></main>
    <p class="admin-note" id="guide-login-note" style="text-align:center; margin-top: 60px;"></p>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/supabase-config.js"></script>
    <script src="../assets/andantino-supabase.js"></script>
    <script src="./guide-preview.js"></script>
  </body>
</html>
