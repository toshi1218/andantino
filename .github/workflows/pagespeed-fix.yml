name: Apply PageSpeed fixes

on:
  workflow_dispatch:
  push:
    branches:
      - fix/pagespeed-mobile-20260807

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixes
        run: node scripts/apply-pagespeed-fix.mjs
      - name: Validate
        run: npm run validate
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "Improve mobile PageSpeed without changing indexing"
          git push origin HEAD:${{ github.ref_name }}
