name: Apply PageSpeed fixes

on:
  push:
    branches:
      - fix/pagespeed-mobile-20260807

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pagespeed-mobile-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply performance and contrast fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          html_files = [p for p in root.rglob('*.html') if '.git' not in p.parts]

          google_block = re.compile(
              r'\s*<link rel="preconnect" href="https://fonts\.googleapis\.com">\s*'
              r'<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin>\s*'
              r'<link\s+href="https://fonts\.googleapis\.com/css2\?[^\"]+"\s+rel="stylesheet"\s*>',
              re.S,
          )

          critical_css = '''<style data-critical="home">
          :root{--cream:#fff9f2;--paper:#fffdf9;--accent:#3c7b86;--accent-dark:#2b5f63;--teal:#264e52;--charcoal:#373431;--muted:#514b46;--line:#e9dfd4;--serif:"Yu Mincho","Hiragino Mincho ProN",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--charcoal);background:var(--cream);font-family:var(--sans);line-height:1.8;-webkit-font-smoothing:antialiased}img{display:block;width:100%;height:auto}a{color:inherit;text-decoration:none}.container{width:min(1160px,calc(100% - 48px));margin-inline:auto}.notice{background:linear-gradient(90deg,#e7f1ee,#fbfefd);color:var(--teal);font-family:var(--serif);font-size:13px}.notice__inner{min-height:38px;display:flex;align-items:center;gap:14px}.header{position:sticky;top:0;z-index:100;background:rgba(255,249,242,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.header__inner{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-family:var(--serif);font-weight:700;letter-spacing:.08em}.header__actions{display:flex;align-items:center;gap:12px}.button,.outline-button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 20px;border-radius:999px;font-weight:700}.button{background:var(--accent-dark);color:#fff}.outline-button{border:1px solid var(--accent-dark);color:var(--accent-dark);background:transparent}.hero{position:relative;overflow:hidden;padding:72px 0 82px;background:linear-gradient(135deg,#fffdf9 0%,#eef6f4 100%)}.hero__grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);align-items:center;gap:64px}.hero__copy h1{margin:12px 0 22px;font-family:var(--serif);font-size:clamp(42px,5.1vw,72px);line-height:1.18;letter-spacing:.02em}.hero__copy h1 span{display:block}.eyebrow{margin:0;color:var(--accent-dark);font-weight:700;letter-spacing:.08em}.hero__lead{font-size:18px;max-width:42rem}.hero__targets{color:var(--muted)}.hero__buttons{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:28px}.hero__cta-note{flex-basis:100%;margin:0;color:var(--muted);font-size:14px}.hero__visual{position:relative}.hero__image{overflow:hidden;border-radius:32px;box-shadow:0 18px 50px rgba(69,50,36,.11)}.hero__image img{aspect-ratio:5/6;object-fit:cover}.hero__badge{position:absolute;right:-12px;bottom:24px;display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:14px;background:#fff;color:var(--teal);box-shadow:0 8px 24px rgba(69,50,36,.12)}@media(max-width:820px){.container{width:min(100% - 32px,1160px)}.notice{display:none}.header__inner{min-height:68px}.header__actions .button,.header__actions .header__phone{display:none}.hero{padding:46px 0 56px}.hero__grid{grid-template-columns:1fr;gap:34px}.hero__copy h1{font-size:clamp(34px,10vw,48px)}.hero__lead{font-size:16px}.hero__visual{max-width:520px;margin-inline:auto}.hero__badge{right:8px;bottom:16px}.hero__buttons{align-items:stretch}.hero__buttons>.button,.hero__buttons>.outline-button{width:100%}}
          </style>'''

          async_css = '''<link rel="preload" href="./styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
          <noscript><link rel="stylesheet" href="./styles.css"></noscript>'''

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              new = google_block.sub('', text)
              if path.name == 'index.html' and path.parent == root:
                  new = new.replace('<link rel="stylesheet" href="./styles.css">', critical_css + '\n    ' + async_css, 1)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          css = root / 'styles.css'
          text = css.read_text(encoding='utf-8')
          text = text.replace('--serif: "Shippori Mincho", "Yu Mincho", serif;', '--serif: "Yu Mincho", "Hiragino Mincho ProN", serif;')
          text = text.replace('--sans: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;', '--sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;')
          text = text.replace('--muted: #5c5650;', '--muted: #514b46;')
          css.write_text(text, encoding='utf-8')

          headers = root / '_headers'
          h = headers.read_text(encoding='utf-8')
          additions = '''

/styles.css
  Cache-Control: public, max-age=31536000, immutable

/script.js
  Cache-Control: public, max-age=31536000, immutable

/*.webp
  Cache-Control: public, max-age=31536000, immutable
'''
          if '/styles.css' not in h:
              h = h.rstrip() + additions
              headers.write_text(h + '\n', encoding='utf-8')
          PY
      - name: Validate
        run: npm run validate
      - name: Commit generated fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html styles.css _headers '*.html' admin/*.html articles/*.html 2>/dev/null || true
          git add -u
          git diff --cached --quiet || git commit -m "Improve mobile PageSpeed without changing indexing"
          git push origin HEAD:fix/pagespeed-mobile-20260807
