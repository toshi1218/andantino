name: Temporary photo refresh

on:
  push:
    branches:
      - agent/site-photo-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[photo-refresh-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-photo-refresh
      - name: Replace photos in appropriate sections
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # 店舗外観：アクセス欄の旧外観写真を更新
          replace('about.html',
              '<img src="./assets/andantino-storefront.webp" width="1400" height="890" loading="lazy" alt="赤い扉とANDANTINOの看板がある和歌山市新高町の店舗外観">',
              '<img src="./assets/site-storefront.webp" width="1200" height="900" loading="lazy" alt="赤い扉が目印のANDANTINO店舗入口">')

          # 大人の靴選び：商品中心のヒーローから、足計測の相談風景へ
          replace('adult-shoes.html',
              'src="./assets/product-bolognese.webp"\n              width="900"\n              height="468"\n              loading="eager"\n              fetchpriority="high"\n              alt="コンフォート・ボロネーゼの婦人靴が棚に並ぶ様子"',
              'src="./assets/site-foot-measurement.webp"\n              width="1200"\n              height="900"\n              loading="eager"\n              fetchpriority="high"\n              alt="足長・足囲・足幅を計測するANDANTINOのカウンセリング"')
          replace('adult-shoes.html',
              'src="./assets/yoko-igarashi-adjusting-shoes.webp"\n                  width="1200"\n                  height="1195"\n                  loading="lazy"\n                  alt="ANDANTINO店内で五十嵐洋子が黒い革靴を調整している様子"',
              'src="./assets/site-tools.webp"\n                  width="1200"\n                  height="900"\n                  loading="lazy"\n                  alt="靴の幅出しやポイントストレッチ、インソール作製に使うANDANTINOの道具"')

          # インソール：作製前のデータ採取をフットプリントで具体化
          replace('insoles.html',
              'src="./assets/yoko-igarashi-counseling.webp"\n                  width="1000"\n                  height="800"\n                  loading="lazy"\n                  alt="お客様のお困りごとを伺うANDANTINO代表・シューフィッターの五十嵐洋子"',
              'src="./assets/site-footprint.webp"\n                  width="1200"\n                  height="900"\n                  loading="lazy"\n                  alt="フットプリントを採取し足裏の状態を確認するANDANTINOのカウンセリング"')
          replace('insoles.html', 'インソール作製前のカウンセリング', '足の計測とフットプリントも確認します')

          # 靴の履き方記事一覧：実際の履かせ方・ひも調整をヒーロー写真として追加
          replace('articles-shoe-wearing.html',
              '<section class="article-hero"><div class="container article-hero__inner"><span class="section-kicker">お役立ち記事</span><h1>靴の履き方・選び方の記事</h1><p>正しい靴の履き方や選び方のポイントを、店頭でお伝えしている内容をもとにまとめています。</p></div></section>',
              '<section class="article-hero"><div class="container article-hero__inner"><span class="section-kicker">お役立ち記事</span><h1>靴の履き方・選び方の記事</h1><p>正しい靴の履き方や選び方のポイントを、店頭でお伝えしている内容をもとにまとめています。</p></div><div class="container"><figure class="article-hero-photo"><img src="./assets/site-shoe-wearing.webp" width="1200" height="900" loading="eager" fetchpriority="high" alt="靴を正しく履かせ、靴ひもや固定を調整する様子"></figure></div></section>')

          # ディモコ：歩行を見る説明の直後に可動域・歩行観察の写真を追加
          replace('dymoco-insole.html',
              '</ul>\n              <p>\n                その結果に合わせて、踵、',
              '</ul>\n              <figure class="legacy-photo legacy-photo--narrow"><img src="./assets/site-gait.webp" width="1200" height="900" loading="lazy" alt="足の可動域を確認し、立ち方と歩行を観察する様子"><figcaption>足だけでなく、可動域・立ち方・歩く姿も確認します</figcaption></figure>\n              <p>\n                その結果に合わせて、踵、')

          # JSON-LDも大人の靴ページの代表画像に合わせる
          replace('adult-shoes.html',
              '"image": "https://andantino-shoes.jp/assets/product-bolognese.webp"',
              '"image": "https://andantino-shoes.jp/assets/site-foot-measurement.webp"')
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/photo-refresh-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html adult-shoes.html insoles.html articles-shoe-wearing.html dymoco-insole.html .github/workflows/photo-refresh-temp.yml
          git commit -m "サイト写真を実際の相談・計測・調整風景へ更新 [photo-refresh-done]"
          git push origin HEAD:agent/site-photo-refresh
